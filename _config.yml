# ================================================================
#  站点配置 —— 日常只需要改这个文件
# ================================================================

# ---- 基本信息 ----
title: "Zjr 的博客"
tagline: "记录技术、折腾与思考"
description: "一个用 Jekyll + GitHub Pages 搭建的中文技术博客：写代码、折腾系统、探索 AI，也记录日常思考。"
author:
  name: "Zjr0118"
  bio: "折腾系统、写代码、记录过程。"
  url: "https://github.com/Zjr0118"

# ---- 域名（仓库名是 username.github.io 时，url 必须是 https://username.github.io）----
url: "https://zjr0118.github.io"
baseurl: ""
lang: "zh-CN"
timezone: "Asia/Shanghai"

# ---- 顶部导航 ----
nav:
  - title: 首页
    url: /
  - title: 归档
    url: /archive/
  - title: 标签
    url: /tags/
  - title: 关于
    url: /about/

# ---- 构建参数 ----
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  toc_levels: 1..3

permalink: /:year/:month/:title/
excerpt_separator: "\n\n"

paginate: 6
paginate_path: "/page:num/"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - .github

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true

# ---- 评论（giscus，可选）----
# 到 https://giscus.app 选择仓库并生成 repo_id / category_id，填进来即可开启评论。
# 留空则整站不显示评论区。
giscus:
  repo: ""
  repo_id: ""
  category: "Announcements"
  category_id: ""
  mapping: "pathname"
  reactions_enabled: "1"
