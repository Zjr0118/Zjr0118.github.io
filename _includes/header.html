<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">Z</span>
      <span class="brand-text">
        <span class="brand-name">{{ site.title }}</span>
        <span class="brand-tagline">{{ site.tagline }}</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="主导航">
      {% for item in site.nav %}
        <a class="nav-link{% if page.url == item.url %} is-active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% endfor %}
    </nav>

    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换深色 / 浅色模式" title="切换主题">
      <span class="icon-sun" aria-hidden="true">☀</span>
      <span class="icon-moon" aria-hidden="true">☾</span>
    </button>
  </div>
</header>
